services:
  - type: web
    name: car-diagnostic-bot
    runtime: python
    repo: https://github.com/yourusername/car-diagnostic-bot  # Change this
    plan: free
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SESSION_TTL_MINUTES
        value: 30
      - key: MAX_SESSIONS
        value: 1000
