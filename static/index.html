<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Car Diagnostic Bot - Interactive Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <div class="app-header">
        <div class="header-content">
          <div class="header-icon">
            <i class="fas fa-car"></i>
          </div>
          <div class="header-text">
            <h1>Car Diagnostic Bot</h1>
            <p>Expert automotive troubleshooting system</p>
          </div>
        </div>
        <div class="header-actions">
          <button id="newSessionBtn" class="new-session-btn">
            <i class="fas fa-plus-circle"></i> New Session
          </button>
        </div>
      </div>

      <!-- Chat Messages Area -->
      <div class="chat-container" id="chatContainer">
        <div class="messages-area" id="messagesArea">
          <div class="message bot-message">
            <div class="message-avatar">
              <i class="fas fa-robot"></i>
            </div>
            <div class="message-bubble">
              <div class="message-content">
                <p>🔧 Initializing diagnostic system...</p>
              </div>
            </div>
          </div>
        </div>
        <div
          class="typing-indicator"
          id="typingIndicator"
          style="display: none"
        >
          <div class="message bot-message">
            <div class="message-avatar">
              <i class="fas fa-robot"></i>
            </div>
            <div class="message-bubble">
              <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-area">
        <div class="input-wrapper">
          <textarea
            id="messageInput"
            placeholder="Describe your car's problem..."
            rows="1"
          ></textarea>
          <button id="sendBtn" class="send-btn">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
        <div class="input-footer">
          <div class="session-status" id="sessionStatus">
            <i class="fas fa-circle" style="font-size: 8px; color: #ef4444"></i>
            Initializing...
          </div>
          <div class="info-text">
            <i class="fas fa-info-circle"></i> Type 'help' for menu
          </div>
        </div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
